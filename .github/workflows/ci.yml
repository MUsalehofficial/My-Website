name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Sync Credly badges
        run: npm run sync:credly

      - name: Check Credly data is committed
        run: |
          if ! git diff --exit-code assets/data/credly-badges.json; then
            echo "::error::credly-badges.json is out of date. Run npm run sync:credly and commit."
            exit 1
          fi
